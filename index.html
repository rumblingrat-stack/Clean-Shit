<!DOCTYPE html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Calcetto</title>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#1f7a43"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Calcetto">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1ec;--card:#fff;--tx:#14201a;--mu:#68776e;--ln:#dde4dd;--ac:#1f7a43;--bl:#2f6bff;--gr:#1f9d55;--ye:#eab308;--re:#dc2626;--p1:#2b8a4e;--p2:#34a05a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1511;--card:#17211b;--tx:#eef3ee;--mu:#8da094;--ln:#27332b;--ac:#3fbf6f;--p1:#215f37;--p2:#2a7a47}}
:root[data-theme="dark"]{--bg:#0d1511;--card:#17211b;--tx:#eef3ee;--mu:#8da094;--ln:#27332b;--ac:#3fbf6f;--p1:#215f37;--p2:#2a7a47}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{background:var(--bg);color:var(--tx);font:15px/1.4 Barlow,system-ui,sans-serif}
#app{height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto}
main{flex:1;overflow-y:auto;padding:12px 14px 24px}
nav{display:grid;grid-template-columns:repeat(4,1fr);background:var(--card);border-top:1px solid var(--ln)}
nav button{background:none;border:0;color:var(--mu);padding:8px 0 7px;font:600 10px Barlow,sans-serif;letter-spacing:.03em;cursor:pointer}
nav button span{display:block;font-size:20px}nav button.on{color:var(--ac)}
h3{font:700 20px 'Barlow Condensed',sans-serif;margin:18px 0 8px}small,.mu{color:var(--mu)}
.card{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:12px;margin-bottom:10px}
.seg{display:flex;background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:3px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;color:var(--mu);padding:8px;border-radius:9px;font:600 14px Barlow,sans-serif;cursor:pointer}
.seg button.on{background:var(--ac);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.chips button,.rt button{border:1px solid var(--ln);background:var(--bg);color:var(--tx);border-radius:9px;padding:6px 11px;font:600 14px Barlow,sans-serif;cursor:pointer}
.chips button.on,.rt button.on{background:var(--ac);border-color:var(--ac);color:#fff}
.rt{display:flex;gap:4px;margin-top:8px}.rt button{flex:1;padding:8px 0;min-width:0}
.lb{font-weight:600;font-size:13px;color:var(--mu);margin-top:4px}
input,select{width:100%;padding:10px;border-radius:10px;border:1px solid var(--ln);background:var(--bg);color:var(--tx);font:15px Barlow,sans-serif;margin:4px 0}
input[type=checkbox]{width:20px;height:20px;margin:0}input[type=file]{display:none}
button.big{width:100%;padding:14px;border:0;border-radius:12px;background:var(--ac);color:#fff;font:700 17px 'Barlow Condensed',sans-serif;cursor:pointer}
button.sm{border:0;background:var(--ac);color:#fff;border-radius:9px;padding:9px 14px;font:600 14px Barlow,sans-serif;cursor:pointer}
button.ghost{background:none;border:0;color:var(--mu);font-size:20px;cursor:pointer}
.back{background:none;border:0;color:var(--ac);font:600 15px Barlow,sans-serif;padding:4px 0 10px;cursor:pointer}
.hero{position:relative;background:linear-gradient(160deg,var(--p1),var(--p2));color:#fff;border:0;text-align:center}.hero small{color:#d8f0df}
.hero .top{cursor:pointer}.vs{display:flex;justify-content:space-around;align-items:center;font:700 26px 'Barlow Condensed',sans-serif;margin:8px 0}.vs span{font-size:15px;opacity:.7}
.chk{display:flex;gap:8px;align-items:center;justify-content:center;background:rgba(0,0,0,.22);border-radius:10px;padding:9px;margin-top:8px;font-weight:600}
.empty{text-align:center;color:var(--mu);padding:22px}
.mc{cursor:pointer;position:relative}.xb{position:absolute;top:7px;right:9px;width:24px;height:24px;border-radius:50%;border:0;background:#fecaca;color:#dc2626;font:700 16px/1 sans-serif;cursor:pointer;z-index:1}.lnk{background:none;border:0;color:var(--mu);font:600 13px Barlow,sans-serif;cursor:pointer}.vb{position:absolute;top:8px;right:11px;font-size:11px;font-weight:600;color:var(--mu)}.vb.ok{color:var(--gr)}.card.inc{background:color-mix(in srgb,var(--card) 90%,#888)}.card.ok{background:color-mix(in srgb,var(--card) 90%,var(--gr))}.mr{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:4px;font-weight:600}.mr span{flex:1}.mr span:last-child{text-align:right}
.sc{font:700 28px 'Barlow Condensed',sans-serif;letter-spacing:.02em}.mr.big{font-size:17px}.mr.big .sc{font-size:40px}
.gl{display:flex;margin:5px 0}.gl.r2{justify-content:flex-end;text-align:right}.gl small{display:block;font-size:12px;line-height:1.2}
.pitch{background:repeating-linear-gradient(var(--p1) 0 44px,var(--p2) 44px 88px);border:2px solid rgba(255,255,255,.55);border-radius:12px;padding:16px 4px 10px;display:flex;flex-direction:column;gap:16px}
.row{display:flex;justify-content:space-around}
.dot{display:flex;flex-direction:column;align-items:center;width:68px;position:relative;color:#fff;font-size:12px;font-weight:600;text-align:center;cursor:pointer}
.dot small{color:#fff;margin-top:3px;max-width:68px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.av{width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.22);border:2px solid #fff;display:grid;place-items:center;overflow:hidden;font-weight:700;flex:none;cursor:pointer}
.av img{width:100%;height:100%;object-fit:cover}
.av.l{width:38px;height:38px;background:var(--bg);border:1px solid var(--ln);color:var(--tx);font-size:13px}
.dot.best .av{border-color:var(--bl);box-shadow:0 0 0 3px var(--bl)}
.bd{position:absolute;top:-7px;right:2px;font:700 12px 'Barlow Condensed',sans-serif;padding:1px 6px;border-radius:9px;color:#fff;border:2px solid #fff}
.bd.g{background:var(--gr)}.bd.y{background:var(--ye);color:#222}.bd.r{background:var(--re)}.bd.best{border-color:var(--bl)}
.pr{display:flex;align-items:center;gap:10px}.pr b{flex:1;font-weight:600}.pr .n{font:700 22px 'Barlow Condensed',sans-serif;min-width:44px;text-align:right}
.pr .bd{position:static;font-size:16px;cursor:pointer;border-color:transparent}
.rk{width:22px;color:var(--mu);font-weight:600}
.mod{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center}.bk{position:absolute;inset:0;background:rgba(0,0,0,.5)}
.sheet{position:relative;background:var(--card);width:100%;max-width:560px;max-height:80%;overflow-y:auto;border-radius:18px 18px 0 0;padding:14px 14px calc(14px + env(safe-area-inset-bottom,0px))}
.opt{display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px solid var(--ln);cursor:pointer}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:20px;z-index:30;font-weight:600}
nav{padding:9px 6px 5px;gap:4px;box-shadow:0 -4px 14px rgba(0,0,0,.05)}
nav button{position:relative;border-radius:14px;padding:7px 0 6px;transition:transform .2s,box-shadow .2s,background .2s,color .2s}
nav button span{transition:transform .2s}
nav button.on{background:color-mix(in srgb,var(--ac) 17%,var(--card));box-shadow:0 0 0 1.5px var(--ac),0 7px 16px color-mix(in srgb,var(--ac) 38%,transparent);transform:translateY(-6px)}
nav button.on span{transform:scale(1.18)}
@keyframes hl{0%,45%{box-shadow:0 0 0 3px #22c55e,0 0 20px rgba(34,197,94,.6)}100%{box-shadow:0 0 0 0 rgba(34,197,94,0)}}
.hl{animation:hl 4s ease-out}
nav .nb{position:absolute;top:2px;right:calc(50% - 25px);width:11px;height:11px;border-radius:50%;background:#22c55e;border:2px solid var(--card);animation:pulse 1.8s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(34,197,94,.6)}70%{box-shadow:0 0 0 7px rgba(34,197,94,0)}100%{box-shadow:0 0 0 0 rgba(34,197,94,0)}}
</style></head><body>
<div id="app"><main id="main"></main><nav id="nav">
<button data-act="tab" data-v="partite"><span>⚽</span>PARTITE</button><button data-act="tab" data-v="classifica"><span>🏆</span>CLASSIFICHE</button><button data-act="tab" data-v="pagelle"><span>📝</span>PAGELLE</button><button data-act="tab" data-v="impostazioni"><span>👥</span>GIOCATORI</button></nav></div>
<div id="modal"></div>
<script>
const $=s=>document.querySelector(s),K='calcetto_v1';
const S={players:[],matches:[]};
const hk=[];let hi=0,armed=0,guarded=false,seen=null,seenInit=false;try{seen=JSON.parse(localStorage.getItem('calcetto_seen'))}catch(e){}seenInit=!!seen;
const stamps=()=>({partite:Math.max(0,...S.matches.flatMap(m=>[m.ts||0,m.pts||0])),pagelle:Math.max(0,...S.matches.filter(m=>m.status=='played').map(m=>m.pts||0)),impostazioni:Math.max(0,...S.players.map(p=>p.ts||0))});
function newIds(t){const x=seen[t];return t=='partite'?S.matches.filter(m=>(m.ts||0)>x||(m.pts||0)>x).map(m=>m.id):t=='pagelle'?S.matches.filter(m=>m.status=='played'&&(m.pts||0)>x).map(m=>m.id):S.players.filter(p=>(p.ts||0)>x).map(p=>p.id)}
function markSeen(){const s=stamps();let ch=false;
if(!seenInit){seenInit=true;seen=s;ch=true}
else{for(const k in s)if(seen[k]==null){seen[k]=s[k];ch=true}
const t=ui.tab;if(s[t]!=null&&s[t]>seen[t]){if(ui.enter)ui.hl={ids:newIds(t),start:Date.now()};seen[t]=s[t];ch=true}}
ui.enter=false;
if(ch)try{localStorage.setItem('calcetto_seen',JSON.stringify(seen))}catch(e){}}
function applyHl(){const h=ui.hl;if(!h||Date.now()-h.start>=4000)return;const t=ui.tab;
const q=t=='impostazioni'?'#main [data-act=pinfo]':'#main [data-m]';
document.querySelectorAll(q).forEach(el=>{const id=t=='impostazioni'?el.dataset.p:el.dataset.m;if(h.ids.includes(id)){const c=el.closest('.card')||el;c.classList.add('hl');c.style.animationDelay='-'+(Date.now()-h.start)/1000+'s'}})}
const snap=()=>({tab:ui.tab,sub:ui.sub,detail:ui.detail,vote:ui.vote,voter:ui.voter,modal:ui.modal});
const nkey=()=>JSON.stringify(snap());
function navSync(){const k=nkey();if(k==hk[hi])return;if(hi>0&&k==hk[hi-1]){history.back();return}hi++;hk.length=hi;hk[hi]=k;history.pushState({i:hi,s:snap()},'')}
window.addEventListener('popstate',e=>{const st=e.state;
if(st&&st.guard){if(armed){armed=0;history.back();return}armed=1;setTimeout(()=>{armed=0},2000);toast('Premi ancora indietro per uscire');history.pushState({i:0,s:snap()},'');hi=0;hk.length=1;hk[0]=nkey();return}
if(!st||!st.s)return;hi=st.i;Object.assign(ui,st.s);hk[hi]=nkey();render()});
const save=()=>{};
const uid=()=>Math.random().toString(36).slice(2,9);
const MODS={5:["2-2","1-2-1","3-1"],6:["2-2-1","3-1-1","2-1-2"],7:["2-3-1","3-2-1","2-2-2","3-1-2"],8:["3-3-1","3-2-2","2-3-2"],10:["4-3-2","3-4-2","4-4-1","3-3-3"]};
let ui={tab:'partite',sub:'lista',detail:null,vote:null,voter:null,draft:null,modal:null,cls:'gol',gt:0};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const P=id=>S.players.find(p=>p.id==id)||{id,name:'Ex giocatore'};
const mm=id=>S.matches.find(m=>m.id==id);
const tn=(m,i)=>m.teams[i].name||'Squadra '+'AB'[i];
const fd=d=>d?new Date(d).toLocaleString('it-IT',{weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):'Data da definire';
const sc=m=>[0,1].map(t=>m.goals.filter(g=>g.t==t).length);
const col=a=>a>=7?'g':a>=6?'y':'r';
const mean=a=>a.reduce((x,y)=>x+y,0)/a.length;
function avg(m,pid){const v=Object.entries(m.ratings||{}).filter(([k,r])=>k!=pid&&r[pid]!=null).map(([k,r])=>r[pid]);return v.length?mean(v):null}
const avIn=p=>p.photo?`<img src="${p.photo}" alt="">`:esc(p.name.slice(0,2).toUpperCase());
const av=p=>`<span class="av l">${avIn(p)}</span>`;
function newDraft(n,old){const x=new Date(Date.now()+864e5);x.setHours(21,0,0,0);return{type:n,date:old?old.date:new Date(x-x.getTimezoneOffset()*6e4).toISOString().slice(0,16),teams:[0,1].map(i=>({name:old?old.teams[i].name:'',mod:MODS[n][0],slots:Array(n).fill(null)}))}}
function mkDraft(){const nx=S.matches.find(m=>m.status=='next');return nx?{id:nx.id,type:nx.type,date:nx.date,teams:JSON.parse(JSON.stringify(nx.teams))}:newDraft(5)}
function pitch(t,ti,mode,m){const L=[1,...t.mod.split('-').map(Number)];let o=0;const rs=L.map(c=>{const r=[];for(let k=0;k<c;k++)r.push(o++);return r});
let best=null,b=-1;if(m&&m.status=='played')t.slots.forEach(id=>{const a=id&&avg(m,id);if(a!=null&&a>b){b=a;best=id}});
return`<div class="pitch">`+rs.reverse().map(r=>`<div class="row">`+r.map(i=>dot(t.slots[i],ti,i,mode,m,best)).join('')+`</div>`).join('')+`</div>`}
function dot(id,ti,i,mode,m,best){const p=id&&P(id);let b='';
if(mode=='view'&&p&&m.status=='played'){const a=avg(m,id);if(a!=null)b=`<b class="bd ${col(a)}${id==best?' best':''}" data-act="votes" data-p="${id}">${a.toFixed(1)}</b>`}
const act=mode=='edit'?`data-act="slot" data-t="${ti}" data-i="${i}"`:'';
return`<div class="dot${id&&id==best?' best':''}" ${act}><span class="av">${p?avIn(p):'+'}</span>${b}<small>${p?esc(p.name):''}</small></div>`}
function vstat(m){const all=m.teams.flatMap(t=>t.slots.filter(Boolean));return[all.filter(id=>Object.keys((m.ratings||{})[id]||{}).length).length,all.length]}
const xb=m=>`<button class="xb" data-act="delm" data-m="${m.id}">×</button>`;
function vb(m){const[n,t]=vstat(m);return n==t?`<span class="vb ok">✓</span>`:`<span class="vb">${n}/${t}</span>`}
function matchCard(m){const[a,b]=sc(m);return`<div class="card mc" data-act="open" data-m="${m.id}">${ui.delM?xb(m):vb(m)}<small>${fd(m.date)} · ${m.type}v${m.type}</small><div class="mr"><span>${esc(tn(m,0))}</span><b class="sc">${a} - ${b}</b><span>${esc(tn(m,1))}</span></div></div>`}
function partiteV(){let h='';
if(ui.sub=='build')return`<button class="back" data-act="cancelbuild">‹ Indietro</button>`+buildV();
const nx=S.matches.find(m=>m.status=='next');
h+=nx?`<div class="card hero"><div class="top" data-act="open" data-m="${nx.id}"><small>Prossima partita · ${nx.type}v${nx.type}</small><div class="vs"><b>${esc(tn(nx,0))}</b><span>VS</span><b>${esc(tn(nx,1))}</b></div><div>${fd(nx.date)}</div></div><label class="chk"><input type="checkbox" data-f="played" data-m="${nx.id}"> Partita giocata</label><div class="chk" style="cursor:pointer" data-act="editnext">✎ Modifica formazioni</div>${ui.delM?xb(nx):''}</div>`:`<div class="card hero" style="padding:14px;cursor:pointer;font:700 19px 'Barlow Condensed',sans-serif" data-act="newnext">+ Aggiungi prossima partita</div>`;
const pl=S.matches.filter(m=>m.status=='played').sort((a,b)=>b.date.localeCompare(a.date));
return h+`<div style="display:flex;justify-content:space-between;align-items:baseline"><h3>Risultati</h3><button class="lnk" data-act="delmode">${ui.delM?'Fine':'Elimina partite'}</button></div>`+(pl.map(matchCard).join('')||'<p class="mu">Ancora nessuna partita giocata.</p>')}
function buildV(){const d=ui.draft||(ui.draft=mkDraft());
let h=`<div class="card"><div class="lb">Tipo di partita</div><div class="chips">${[5,6,7,8,10].map(n=>`<button class="${d.type==n?'on':''}" data-act="type" data-v="${n}">${n}v${n}</button>`).join('')}</div><div class="lb">Data e ora</div><input type="datetime-local" data-f="date" value="${d.date}"></div>`;
d.teams.forEach((t,i)=>{h+=`<div class="card"><input data-f="name" data-t="${i}" placeholder="Nome squadra ${'AB'[i]} (facoltativo)" value="${esc(t.name)}"><div class="lb">Modulo</div><div class="chips">${MODS[d.type].map(m=>`<button class="${t.mod==m?'on':''}" data-act="mod" data-t="${i}" data-v="${m}">${m}</button>`).join('')}</div>${pitch(t,i,'edit')}</div>`});
return h+`<button class="big" data-act="confirm">${d.id?'Salva modifiche':'Conferma partita'}</button>`}
function detailV(){const m=mm(ui.detail),pl=m.status=='played',[a,b]=sc(m);
let h=`<button class="back" data-act="back">‹ Indietro</button><div class="card"><small>${fd(m.date)} · ${m.type}v${m.type}${pl?'':' · da giocare'}</small><div class="mr big"><span>${esc(tn(m,0))}</span><b class="sc">${pl?a+' - '+b:'vs'}</b><span>${esc(tn(m,1))}</span></div>`;
if(pl)h+=m.goals.map((g,i)=>`<div class="gl ${g.t?'r2':''}"><span>⚽ ${esc(P(g.s).name)}${g.a?`<small>assist ${esc(P(g.a).name)}</small>`:''}</span><button class="ghost" style="padding:0 6px;font-size:16px" data-act="delgoal" data-v="${g.id}">×</button></div>`).join('');
h+=`</div>`;
if(pl){const ts=m.teams[ui.gt].slots.filter(Boolean),op=ts.map(id=>`<option value="${id}">${esc(P(id).name)}</option>`).join('');
h+=`<div class="card"><div class="lb">Aggiungi un gol</div><select data-f="gt"><option value="0" ${ui.gt==0?'selected':''}>${esc(tn(m,0))}</option><option value="1" ${ui.gt==1?'selected':''}>${esc(tn(m,1))}</option></select><select id="gs"><option value="">Marcatore…</option>${op}</select><select id="ga"><option value="">Nessun assist</option>${op}</select><button class="sm" data-act="addgoal">Aggiungi gol</button></div>`}
h+=`<h3>Formazioni</h3>`+(pl?'':`<button class="sm" data-act="editnext">✎ Modifica formazioni</button>`);[0,1].forEach(i=>h+=`<div class="lb" style="margin:8px 0 4px">${esc(tn(m,i))} · ${m.teams[i].mod}</div>`+pitch(m.teams[i],i,'view',m));
return h+(pl?`<p class="mu">Tocca un voto per vedere chi lo ha dato.</p>`:'')}
function classV(){const st=S.players.map(p=>{const pm=S.matches.filter(m=>m.status=='played'&&m.teams.some(t=>t.slots.includes(p.id))),v=pm.map(m=>avg(m,p.id)).filter(x=>x!=null);
return{p,n:pm.length,gol:pm.reduce((s,m)=>s+m.goals.filter(g=>g.s==p.id).length,0),ass:pm.reduce((s,m)=>s+m.goals.filter(g=>g.a==p.id).length,0),vot:v.length?mean(v):null}});
const k=ui.cls;st.sort((a,b)=>(b[k]??-1)-(a[k]??-1)||b.n-a.n);
let h=`<div class="seg">${[['gol','Gol'],['ass','Assist'],['vot','Valutazioni']].map(([v,l])=>`<button class="${k==v?'on':''}" data-act="cls" data-v="${v}">${l}</button>`).join('')}</div>`;
if(!st.length)return h+`<div class="card empty">Aggiungi i giocatori dalla sezione Giocatori.</div>`;
return h+st.map((r,i)=>`<div class="card pr"><span class="rk">${i+1}</span>${av(r.p)}<b>${esc(r.p.name)}<small style="display:block;font-weight:400">${r.n} partit${r.n==1?'a':'e'}</small></b>${k=='vot'?(r.vot==null?'<span class="n mu">–</span>':`<b class="bd ${col(r.vot)}" style="flex:none">${r.vot.toFixed(2)}</b>`):`<span class="n">${r[k]}</span>`}</div>`).join('')}
function pagelleV(){if(ui.vote)return voteV();const pl=S.matches.filter(m=>m.status=='played').sort((a,b)=>b.date.localeCompare(a.date));
if(!pl.length)return`<div class="card empty">Quando una partita è segnata come giocata, qui puoi votare i giocatori.</div>`;
return`<h3 style="margin-top:4px">Scegli la partita da votare</h3>`+pl.map(m=>{const[a,b]=sc(m),[n,t]=vstat(m);
return`<div class="card mc ${n==t?'ok':'inc'}" data-act="openv" data-m="${m.id}">${vb(m)}<small>${fd(m.date)} · ${m.type}v${m.type}</small><div class="mr"><span>${esc(tn(m,0))}</span><b class="sc">${a} - ${b}</b><span>${esc(tn(m,1))}</span></div></div>`}).join('')}
