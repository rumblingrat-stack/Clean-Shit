.pav{position:relative;display:inline-block;cursor:pointer}
.pav .av.l{width:112px;height:112px;font-size:36px;border:2px solid #22e06b;box-shadow:0 0 0 3px rgba(34,224,107,.18)}
.pcam{position:absolute;right:2px;bottom:2px;width:32px;height:32px;border-radius:50%;background:#22c55e;border:3px solid var(--card);display:grid;place-items:center;color:#05210f}
.pcam svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.plb h3{margin:10px 0 0;font:700 24px 'Barlow Condensed',sans-serif}
.plsub{font-size:13px;color:var(--mu);margin-top:1px}
.pg4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.pg3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.pst{background:color-mix(in srgb,var(--ac) 7%,var(--bg));border:1px solid var(--ln);border-radius:12px;padding:8px 3px 7px;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.pst .pi{font-size:15px;line-height:1;margin-bottom:2px}
.pst .pv2{font:700 28px/1.05 'Barlow Condensed',sans-serif;color:#22e06b;white-space:nowrap}
.pst small{font:600 11px Barlow,sans-serif;color:var(--mu);margin-top:1px}
.pst .vnp{font:700 24px/1.05 'Barlow Condensed',sans-serif;white-space:nowrap}.pst .vnp i{font-style:normal;color:var(--mu);font-size:16px;margin:0 2px}
.vbar{display:flex;width:80%;height:4px;border-radius:2px;overflow:hidden;background:var(--ln);margin:5px 0 2px}.vbar i{display:block;height:100%}
.sk{display:flex;flex-wrap:wrap;justify-content:center;gap:3px;min-height:26px;align-items:center;margin:2px 0}
.sk b{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font:700 10px/1 Barlow,sans-serif;color:#fff}
.sk b.V{background:#1f9d55}.sk b.N{background:#d4a017;color:#2a2000}.sk b.P{background:#e05a5a}
.avc{background:color-mix(in srgb,var(--ac) 5%,var(--card));border:1px solid var(--ln);border-radius:14px;padding:12px 10px;margin-top:10px;text-align:left}
.avc .lb{margin:0 0 10px}
.avs{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.avs>div{display:flex;flex-direction:column;align-items:center;gap:4px}
.avs .vc{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font:700 15px/1 'Barlow Condensed',sans-serif;border:2px dashed color-mix(in srgb,var(--mu) 55%,transparent);color:var(--mu)}
.avs .vc.g{background:#1f9d55;border:0;color:#fff}.avs .vc.y{background:#eab308;border:0;color:#2a2000}.avs .vc.r{background:#dc2626;border:0;color:#fff}
.avs small{font:600 10px Barlow,sans-serif;color:var(--mu)}
/* ===== icone SVG, podio, drag scheda ===== */
.i-cal{color:var(--ng)}.i-og{color:#e05a5a}
.gbx .ci{width:11px;height:11px;flex:none;color:#fff!important;stroke-width:2.2;vertical-align:0}
.gl .ci{width:16px;height:16px;vertical-align:-3px;margin-right:1px}
.pst .pi{display:flex;justify-content:center;align-items:center;line-height:1}.pst .pi .ci{width:18px;height:18px;vertical-align:0}
.cdm .ci{width:11px;height:11px;vertical-align:-1.5px;margin-right:3px;stroke-width:2}
[data-act=pinfo]{cursor:pointer}
.sheet.pls .shh{padding-top:12px;touch-action:none;cursor:grab;-webkit-user-select:none;user-select:none}
.sheet.pls .grab{width:44px;height:5px;margin-bottom:12px}
/* riquadro risultato: icone chiare + contatore gol */
:root{--gi:#374151;--gio:#dc2626}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--gi:#f1f5f9;--gio:#fca5a5}}
:root[data-theme="dark"]{--gi:#f1f5f9;--gio:#fca5a5}
.gl .ci.i-ball,.gl .ci.i-og{color:var(--gi)}.gl .ci.i-og{color:var(--gio)}
.gl .gc{background:transparent;color:var(--gi);border:1.5px solid var(--gi);padding:0 6px;line-height:12px;height:16px;font-size:12px;letter-spacing:.02em}
/* icone nav SVG: contorno (inattiva) / piena con dettagli trasparenti (attiva) */
.ni svg{display:block;width:100%;height:100%;overflow:visible}
.ni .o{fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ni .f{fill:currentColor;stroke:currentColor;stroke-width:1.2;stroke-linecap:round;stroke-linejoin:round;display:none}
nav button.on .ni .f{display:inline}nav button.on .ni .o{display:none}
