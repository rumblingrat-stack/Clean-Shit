.prcdh .av.l{width:42px;height:42px;font-size:14px}
.prun{flex:1;min-width:0;font:700 20px/1.1 'Barlow Condensed',sans-serif;letter-spacing:.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prres{margin-top:10px;padding:10px;border-radius:10px;background:color-mix(in srgb,var(--ac) 7%,var(--bg));border:1px solid var(--ln)}
.prrl{display:block;font:700 11px/1 Barlow,sans-serif;letter-spacing:.04em;color:var(--mu);margin-bottom:8px}
.prrr{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:8px}
.prts{display:flex;align-items:center;justify-content:flex-start;min-width:0}
.prts.r{justify-content:flex-end;text-align:right}
.prtn{display:inline-block;max-width:100%;font:700 17px/1.15 'Barlow Condensed',sans-serif;color:var(--tx);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:3px 7px;border-radius:8px;border:1px solid transparent;transition:box-shadow .2s,border-color .2s,background .2s,color .2s}
.prtn.win{background:rgba(34,197,94,.24);border-color:rgba(74,222,128,.75);color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.55);box-shadow:0 0 14px rgba(34,197,94,.55),0 0 24px rgba(34,197,94,.25),inset 0 0 8px rgba(74,222,128,.22)}
:root:not([data-theme="dark"]) .prtn.win{background:#198746;border-color:#22c55e;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.35);box-shadow:0 0 12px rgba(34,197,94,.48),0 0 20px rgba(34,197,94,.2)}
.prts.drw .prtn{background:rgba(148,163,184,.14);border-color:rgba(148,163,184,.45)}
.prsc{align-self:center;font:700 24px/1 'Barlow Condensed',sans-serif;color:#fff;background:rgba(0,0,0,.38);border:1px solid var(--ln);border-radius:8px;padding:6px 12px;white-space:nowrap}
:root:not([data-theme="dark"]) .prsc{color:var(--tx);background:rgba(20,32,26,.08)}
.prgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.prti{display:flex;flex-direction:column;gap:3px;padding:8px 10px;border-radius:10px;background:color-mix(in srgb,var(--ac) 5%,var(--bg));border:1px solid var(--ln);min-width:0}
.prtlb{font:700 11px/1 Barlow,sans-serif;letter-spacing:.03em;color:var(--mu);white-space:nowrap}
.prlive .prtv{flex-wrap:wrap;align-items:center;gap:2px 6px}
.prlive .prtv b{font:600 15px/1.2 Barlow,sans-serif;color:var(--tx);min-width:0;overflow:visible;text-overflow:clip;white-space:normal;overflow-wrap:anywhere}
.prtv{display:flex;align-items:baseline;justify-content:space-between;gap:6px;min-width:0}
.prtv b{font:600 16px/1.2 Barlow,sans-serif;color:var(--tx);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prcnt{font:700 15px/1 'Barlow Condensed',sans-serif;font-style:normal;color:#fff;flex:none}
.prlive{margin-top:12px;padding:12px;border-radius:14px;background:linear-gradient(160deg,color-mix(in srgb,var(--ac) 13%,var(--card)),color-mix(in srgb,var(--ac) 4%,var(--bg)));border:1px solid color-mix(in srgb,var(--ac) 34%,var(--ln))}
.prliveh{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.prlivet{display:inline-flex;align-items:center;gap:6px;font:700 13px/1 Barlow,sans-serif;letter-spacing:.04em;text-transform:uppercase;color:var(--ac)}
.prliveh small{font:600 12px/1 Barlow,sans-serif;color:var(--mu)}
.prlive .prres{margin-top:0;background:color-mix(in srgb,var(--card) 75%,var(--bg))}
.prsub{font:700 14px/1 'Barlow Condensed',sans-serif;font-style:normal;color:var(--ac);flex:none;white-space:nowrap}
